[package]
name = "fcitx5-tregai"
version = "1.0.0"
edition = "2021"
description = "Tre Gai Vietnamese Input Method Engine for Fcitx5"
license = "GPL-3.0-or-later"
authors = ["LocShadowVN"]

[lib]
name = "fcitx5_tregai"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tregai-gui"
path = "src/bin/tregai-gui.rs"

[features]
default = []
fcitx5-plugin = ["dep:cc", "dep:pkg-config"]
native-webview = ["dep:wry", "dep:tao"]

[dependencies]
libc = "0.2"
wry = { version = "0.55", optional = true }
tao = { version = "0.35", optional = true }

[build-dependencies]
cc = { version = "1.1", optional = true }
pkg-config = { version = "0.3", optional = true }
